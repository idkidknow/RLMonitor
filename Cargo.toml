[package]
name = "rlmonitor"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
async-stream = "0.3.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
dotenvy = "0.15.7"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
